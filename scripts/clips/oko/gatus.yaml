# Staged gatus for the oko demo clip. Every target is a container on the
# clip's own Docker network; cloud_syncthing is left out on purpose, so oko
# shows its "unknown" card for File sync.
web:
  port: 443
  tls:
    certificate-file: /certs/uptime.pem
    private-key-file: /certs/uptime-key.pem
x-check: &check
  interval: 5s
  conditions:
    - "[STATUS] == 200"
endpoints:
  - {
      <<: *check,
      group: home,
      name: audiobookshelf,
      url: "http://books.example.com/",
    }
  - { <<: *check, group: home, name: gitea, url: "http://git.example.com/" }
  - { <<: *check, group: home, name: immich, url: "http://photos.example.com/" }
  - {
      <<: *check,
      group: home,
      name: linkwarden,
      url: "http://links.example.com/",
    }
  - { <<: *check, group: home, name: trilium, url: "http://notes.example.com/" }
  - {
      <<: *check,
      group: cloud,
      name: librespeed,
      url: "http://speed.example.com/",
    }
  - {
      <<: *check,
      group: cloud,
      name: vaultwarden,
      url: "http://passwords.example.com/",
    }
  - {
      <<: *check,
      group: cloud,
      name: stalwart,
      url: "http://mail.example.com/",
    }
  - { <<: *check, group: cloud, name: radicale, url: "http://cal.example.com/" }
