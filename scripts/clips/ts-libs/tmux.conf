# The demo's tmux: no status bar, a thin Rule-coloured border between panes,
# and a plain bash in every pane so no personal prompt or path shows.
set -g status off
set -g default-command "bash --norc --noprofile"
set -g default-terminal "tmux-256color"
set -g pane-border-style "fg=#413c38"
set -g pane-active-border-style "fg=#413c38"
set -g pane-border-lines single
