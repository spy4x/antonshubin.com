<!doctype html>
<!--
  The chat frame the clip records. record.ts loads it with goto after an init
  script set window.__exchange (exchange.json from exchange.ts). Every
  question, tool call, tool result and answer shown comes from that file; the
  page only paces it. Playwright types each question into the composer and
  clicks Send; Send then plays that turn and sets window.__turnDone.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark">
    <title>caldav-mcp demo</title>
    <style>
    @font-face {
      font-family: "Plex Sans";
      src: url("../../../assets/fonts/ibm-plex-sans-latin-400-normal.woff2")
        format("woff2");
      font-weight: 400;
    }
    @font-face {
      font-family: "Plex Sans";
      src: url("../../../assets/fonts/ibm-plex-sans-latin-600-normal.woff2")
        format("woff2");
      font-weight: 600;
    }
    @font-face {
      font-family: "Plex Mono";
      src: url("../../../assets/fonts/ibm-plex-mono-latin-400-normal.woff2")
        format("woff2");
      font-weight: 400;
    }
    :root {
      --ink: #15120f;
      --desk: #1c1916;
      --paper: #25211d;
      --lamp: #2f2a26;
      --rule: #413c38;
      --rule-strong: #857f79;
      --parchment: #efebe2;
      --graphite: #bcb7af;
      --accent: #f97316;
      --sage: #83d494;
      --mist: #8ec5ec;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--ink);
      color: var(--parchment);
      font: 400 18px/1.5 "Plex Sans", system-ui, sans-serif;
    }
    body {
      display: grid;
      grid-template-rows: 56px 1fr auto;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 28px;
      background: var(--desk);
      border-bottom: 1px solid var(--rule);
    }
    header h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 600;
    }
    .server {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      color: var(--graphite);
      font-size: 15px;
    }
    .server b {
      color: var(--parchment);
      font-weight: 600;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--sage);
    }
    header .demo {
      margin-left: auto;
      color: var(--graphite);
      font-size: 15px;
    }
    #chat {
      overflow-y: auto;
      scrollbar-width: none;
      padding: 16px 0 8px;
    }
    .col {
      width: 900px;
      margin: 0 auto;
    }
    .empty {
      height: 100%;
      display: grid;
      place-content: center;
      text-align: center;
      gap: 10px;
    }
    .empty p {
      margin: 0;
    }
    .empty .big {
      font-size: 30px;
      font-weight: 600;
    }
    .empty .small {
      color: var(--graphite);
      font-size: 17px;
    }
    .user {
      display: flex;
      justify-content: flex-end;
      margin: 4px 0 12px;
    }
    .user div {
      max-width: 70%;
      padding: 8px 18px;
      background: var(--lamp);
      border-radius: 18px 18px 4px 18px;
    }
    .call {
      margin: 0 0 8px;
      border: 1px solid var(--rule);
      border-radius: 12px;
      background: var(--paper);
      overflow: hidden;
      font-size: 16px;
    }
    .call .head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
    }
    .call .name {
      font-family: "Plex Mono", ui-monospace, monospace;
      color: var(--mist);
    }
    .call .via {
      color: var(--graphite);
      font-size: 14px;
    }
    .call .status {
      margin-left: auto;
      color: var(--graphite);
      font-size: 15px;
    }
    .call .status.ok {
      color: var(--sage);
    }
    .call .body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 450ms ease;
    }
    .call.collapsed .body {
      grid-template-rows: 0fr;
    }
    .call .body > div {
      overflow: hidden;
    }
    .call pre {
      margin: 0;
      padding: 10px 14px 12px;
      border-top: 1px solid var(--rule);
      font: 400 15px/1.6 "Plex Mono", ui-monospace, monospace;
      color: var(--graphite);
      white-space: pre-wrap;
    }
    .call pre .k {
      color: var(--parchment);
    }
    .spin {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 6px;
      border: 2px solid var(--rule-strong);
      border-top-color: var(--parchment);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: -1px;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .answer {
      margin: 10px 0 14px;
    }
    .answer p {
      margin: 0 0 6px;
    }
    .answer ul {
      margin: 0 0 6px;
      padding-left: 24px;
    }
    .answer strong {
      font-weight: 600;
    }
    .answer li::marker {
      color: var(--graphite);
    }
    .thinking {
      color: var(--graphite);
      font-size: 16px;
      margin: 4px 0 14px;
    }
    footer {
      padding: 4px 0 12px;
      background: var(--ink);
    }
    .composer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px 8px 20px;
      background: var(--paper);
      border: 1px solid var(--rule-strong);
      border-radius: 16px;
    }
    .composer input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--parchment);
      font: inherit;
      caret-color: var(--accent);
    }
    .composer input::placeholder {
      color: var(--graphite);
    }
    .composer button {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: var(--lamp);
      color: var(--graphite);
      font-size: 22px;
      cursor: pointer;
      transition: background 150ms, color 150ms;
    }
    .composer button.ready {
      background: var(--parchment);
      color: var(--ink);
    }
    .note {
      margin: 8px 0 0;
      text-align: center;
      color: var(--graphite);
      font-size: 13px;
    }
    </style>
  </head>
  <body>
    <header>
      <h1>Assistant</h1>
      <span
        class="server"><span class="dot"></span><b>caldav-mcp</b> <span id="toolCount"></span></span>
      <span class="demo">Demo calendar</span>
    </header>
    <main id="chat">
      <div class="empty col" id="empty">
        <p class="big">What can I help with?</p>
        <p
          class="small">Your calendars and tasks are connected through caldav-mcp.</p>
      </div>
    </main>
    <footer>
      <div class="col">
        <form class="composer" id="composer">
          <input id="msg" autocomplete="off"
            placeholder="Ask about your calendar or tasks" aria-label="Message">
          <button id="send" aria-label="Send">↑</button>
        </form>
        <p class="note" id="note"></p>
      </div>
    </footer>
    <script>
    const ex = window.__exchange;
    const $ = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    $("toolCount").textContent = `· ${ex.tools.length} tools`;
    $("note").textContent =
      `Replay of a real exchange: ${ex.model} · caldav-mcp 1.6.0 · a demo Radicale calendar`;

    const chat = $("chat");
    let column = null;
    const follow = () =>
      chat.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });
    const add = (el) => {
      if (!column) {
        $("empty").remove();
        column = document.createElement("div");
        column.className = "col";
        chat.append(column);
      }
      column.append(el);
      follow();
      return el;
    };
    const h = (tag, cls, text) => {
      const el = document.createElement(tag);
      if (cls) el.className = cls;
      if (text !== undefined) el.textContent = text;
      return el;
    };

    /** Shortens a long value for the card; the full value is in exchange.json. */
    const short = (v) => {
      const s = typeof v === "string" ? v : JSON.stringify(v);
      if (/^https?:\/\//.test(s)) {
        return `"…${new URL(s).pathname.replace(/^\/[^/]+/, "")}"`;
      }
      if (s.length > 34) {
        return `"${s.replace(/^"|"$/g, "").replace(/\\"/g, "").slice(0, 12)}…"`;
      }
      return JSON.stringify(v);
    };
    /** One line about what the server answered, read from the real result. */
    const summary = (call) => {
      const r = call.result ?? {};
      const n = (k, one, many) => `${r[k]} ${r[k] === 1 ? one : many}`;
      if (call.name === "query_todos") {
        return `${n("total", "task", "tasks")}${
          r.overdue ? `, ${r.overdue} overdue` : ""
        }`;
      }
      if (call.name === "query_events") return n("total", "event", "events");
      if (call.name === "update_todo") {
        return r.todo?.due
          ? `saved, due ${r.todo.due.slice(0, 16).replace("T", " ")}`
          : "saved";
      }
      return "done";
    };

    /** Text with **bold** spans; an unclosed ** while streaming is already bold. */
    const inline = (tag, text) => {
      const el = h(tag);
      text.split("**").forEach((part, i) =>
        el.append(i % 2 ? h("strong", null, part) : part)
      );
      return el;
    };
    /** Renders the answer's Markdown subset: paragraphs, "- " lists, **bold**. */
    const render = (el, text) => {
      el.replaceChildren();
      let list = null;
      for (const line of text.split("\n")) {
        if (line.startsWith("- ")) {
          if (!list) list = el.appendChild(h("ul"));
          list.append(inline("li", line.slice(2)));
        } else if (line.trim()) {
          list = null;
          el.append(inline("p", line));
        } else list = null;
      }
    };

    let turnIndex = 0;
    window.__turnDone = -1;
    $("msg").addEventListener("input", () => {
      $("send").classList.toggle("ready", $("msg").value.trim() !== "");
    });
    $("composer").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!$("msg").value.trim()) return;
      play(turnIndex++);
    });

    async function play(i) {
      const turn = ex.turns[i];
      const input = $("msg");
      add(h("div", "user")).append(h("div", null, input.value));
      input.value = "";
      $("send").classList.remove("ready");
      const thinking = add(h("p", "thinking", "Thinking…"));
      await sleep(900);
      thinking.remove();

      const cards = [];
      for (const call of turn.calls) {
        const card = h("div", "call");
        const head = card.appendChild(h("div", "head"));
        head.append(h("span", "name", call.name), h("span", "via", "caldav-mcp"));
        const status = head.appendChild(h("span", "status"));
        status.innerHTML = `<span class="spin"></span>Running`;
        const body = card.appendChild(h("div", "body")).appendChild(h("div"));
        const pre = body.appendChild(h("pre"));
        for (const [k, v] of Object.entries(call.input)) {
          const row = pre.appendChild(h("div"));
          row.append(h("span", "k", k), `: ${short(v)}`);
        }
        add(card);
        cards.push({ card, status, call });
        await sleep(700);
      }
      for (const { status, call } of cards) {
        await sleep(500);
        status.className = "status ok";
        status.textContent = `✓ ${summary(call)}`;
      }
      // Hold the expanded cards so the arguments can be read.
      await sleep(cards.length ? 2600 : 0);
      for (const { card } of cards) card.classList.add("collapsed");
      await sleep(cards.length ? 500 : 0);

      const answer = add(h("div", "answer"));
      const words = turn.answer.split(/(\s+)/);
      let shown = "";
      for (const w of words) {
        shown += w;
        render(answer, shown);
        follow();
        await sleep(/\s/.test(w) ? 0 : 85);
      }
      window.__turnDone = i;
    }
    </script>
  </body>
</html>
