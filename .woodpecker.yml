# Runs on pull requests into main, pushes to main and the cron trigger.
# `branch` matches a pull request by its target branch, so a commit on a PR
# branch builds once, as a pull_request, not again as a push.
when:
  - event: [push, pull_request]
    branch: main
  - event: cron

steps:
  check:
    image: denoland/deno:2.9.0
    commands:
      - deno install
      # test/lead-form.browser.test.ts, test/a11y.browser.test.ts,
      # test/contrast.browser.test.ts, test/csp.browser.test.ts,
      # test/sw-retired.browser.test.ts, test/visual-system.browser.test.ts,
      # test/notes.browser.test.ts and test/meet-embed.browser.test.ts
      # (deno task test:browser, run inside "deno task check") drive a real
      # Chromium. The base image has none,
      # so install it at the version
      # pinned in deno.json's "playwright" import (and test/browser.ts), so
      # the download lands on the browser build that version expects, with
      # OS deps included, since this container has none of the desktop libs
      # a headless Chromium needs.
      - deno run -A npm:playwright@1.63.0 install --with-deps chromium
      # scripts/video-cut.test.ts renders a generated clip with ffmpeg (libass
      # burns the captions, so it needs a font); the base image has neither.
      - apt-get update && apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - deno task check
    when:
      event: [push, pull_request]

  # The Lighthouse budget ("Design gate" in the global agent rules): every
  # page in scripts/lighthouse/lighthouserc.json scores, in Lighthouse mobile,
  # at least 95 for performance and 100 for accessibility, best practices and
  # SEO. scripts/lighthouse/run.sh serves the built site behind nginx with
  # gzip, as Cloudflare serves it. After check: both build into _fresh/ in the
  # shared checkout.
  # The Playwright image, not the Deno one: Lighthouse CI starts Lighthouse
  # with `node`, and the image has Node, Chromium and its libraries. Deno is
  # the release the check step uses, 2.9.0.
  lighthouse:
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    commands:
      - |
          curl -fsSL -o /tmp/deno.zip https://github.com/denoland/deno/releases/download/v2.9.0/deno-x86_64-unknown-linux-gnu.zip
          echo "96c9c73fc05ea57603bc28d8071d41e861bd40bcf2a9f849dd5969ed1a2c8498  /tmp/deno.zip" | sha256sum -c -
          apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip nginx
          unzip -q -o /tmp/deno.zip -d /usr/local/bin
          chmod +x /usr/local/bin/deno
      - deno install
      - deno task build
      - deno task lighthouse
    depends_on: [check]
    when:
      event: [push, pull_request]

  # Sunday numbers report: visitors/pages/referrers/CTA events (Umami), stars
  # (GitHub), subscribers/views (YouTube) — printed as markdown and pushed to
  # NTFY. Fires only on the "weekly-numbers" cron trigger, never on push or
  # pull_request, so it never runs `deno task check` and `check` never runs on
  # this trigger. See docs/weekly-numbers.md for the one-time cron setup and
  # the env vars this step needs.
  weekly-numbers:
    image: denoland/deno:2.9.0
    commands:
      - deno install
      - deno task weekly-numbers
    environment:
      UMAMI_API_URL:
        from_secret: umami_api_url
      UMAMI_API_TOKEN:
        from_secret: umami_api_token
      UMAMI_ID:
        from_secret: umami_id
      GITHUB_REPOS:
        from_secret: weekly_numbers_github_repos
      YOUTUBE_API_KEY:
        from_secret: youtube_api_key
      YOUTUBE_CHANNEL_ID:
        from_secret: youtube_channel_id
      NTFY_URL:
        from_secret: ntfy_url
      NTFY_TOPIC:
        from_secret: ntfy_topic
    when:
      event: cron
      cron: weekly-numbers
