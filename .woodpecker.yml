# Runs on pull requests into main, pushes to main and the cron trigger.
# `branch` matches a pull request by its target branch, so a commit on a PR
# branch builds once, as a pull_request, not again as a push.
when:
  - event: [push, pull_request]
    branch: main
  - event: cron

steps:
  # One build that every later step shares through the workspace: the Deno
  # cache (DENO_DIR in .ci/, gitignored), node_modules, _fresh/ and a copy of
  # this image's deno binary, so the Playwright and ffmpeg images below run
  # the same Deno 2.9.0 with no download. The steps after it run side by side.
  build:
    image: denoland/deno:2.9.0@sha256:8d24854de78a79c56e74b49aa4c5996c60e1fe3730efba8fbdd2692c582e6e29
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir"
      - mkdir -p .ci/bin && cp "$(command -v deno)" .ci/bin/deno
      - deno install --frozen
      - deno task build
    when:
      event: [push, pull_request]

  # What `deno task check` runs before the browser tests, minus the build
  # (done above). scripts/video-cut.test.ts needs ffmpeg and runs in its own
  # step below.
  unit:
    image: denoland/deno:2.9.0@sha256:8d24854de78a79c56e74b49aa4c5996c60e1fe3730efba8fbdd2692c582e6e29
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir"
      - deno fmt --check .
      - deno lint .
      - deno check
      - deno task test:unit --ignore=scripts/video-cut.test.ts
    depends_on: [build]
    when:
      event: [push, pull_request]

  # The browser-driven tests (every test/**/*.browser.test.ts) in three shards
  # balanced by their CI times (scripts/browser-shard.ts). The Playwright image
  # matches deno.json's "playwright" import (1.63.0): it holds the Chromium
  # build that version launches, its libraries and fonts, so no step downloads
  # a browser.
  browser-1:
    image: &playwright mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir" PATH="$${CI_WORKSPACE}/.ci/bin:$${PATH}"
      - deno run -A scripts/browser-shard.ts 1/3
    depends_on: [build]
    when:
      event: [push, pull_request]

  browser-2:
    image: *playwright
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir" PATH="$${CI_WORKSPACE}/.ci/bin:$${PATH}"
      - deno run -A scripts/browser-shard.ts 2/3
    depends_on: [build]
    when:
      event: [push, pull_request]

  browser-3:
    image: *playwright
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir" PATH="$${CI_WORKSPACE}/.ci/bin:$${PATH}"
      - deno run -A scripts/browser-shard.ts 3/3
    depends_on: [build]
    when:
      event: [push, pull_request]

  # scripts/video-cut.test.ts renders a generated clip with ffmpeg and ffprobe
  # (libass burns the captions, so it needs a font). This image has all of
  # them, and glibc for the copied deno. It sets LD_LIBRARY_PATH, which Deno
  # passes to a child process only under a bare --allow-run: hence -A.
  video-cut:
    image: jrottenberg/ffmpeg:7.1-ubuntu2404@sha256:292a972c60356abd651d9a4f9c808c13e7473f65ad400b7eb99215f4e571931d
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir" PATH="$${CI_WORKSPACE}/.ci/bin:$${PATH}"
      - deno test -A scripts/video-cut.test.ts
    depends_on: [build]
    when:
      event: [push, pull_request]

  # The Lighthouse budget ("Design gate" in the global agent rules): every
  # page in scripts/lighthouse/lighthouserc.json scores, in Lighthouse mobile,
  # at least 95 for performance and 100 for accessibility, best practices and
  # SEO. scripts/lighthouse/run.sh serves the build step's _fresh/ behind nginx
  # with gzip, as Cloudflare serves it. The Playwright image: Lighthouse CI
  # starts Lighthouse with `node`, and the image has Node, Chromium and its
  # libraries. It has no nginx, the one package this pipeline installs.
  lighthouse:
    image: *playwright
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir" PATH="$${CI_WORKSPACE}/.ci/bin:$${PATH}"
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends nginx
      - deno task lighthouse
    depends_on: [build]
    when:
      event: [push, pull_request]

  # Sunday numbers report: visitors/pages/referrers/CTA events (Umami), stars
  # (GitHub), subscribers/views (YouTube) — printed as markdown and pushed to
  # NTFY. Fires only on the "weekly-numbers" cron trigger, never on push or
  # pull_request, and no build or test step runs on this trigger. See
  # docs/weekly-numbers.md for the one-time cron setup and the env vars this
  # step needs.
  weekly-numbers:
    image: denoland/deno:2.9.0@sha256:8d24854de78a79c56e74b49aa4c5996c60e1fe3730efba8fbdd2692c582e6e29
    commands:
      - deno install --frozen
      - deno task weekly-numbers
    environment:
      UMAMI_API_URL:
        from_secret: umami_api_url
      UMAMI_API_TOKEN:
        from_secret: umami_api_token
      UMAMI_ID:
        from_secret: umami_id
      GITHUB_REPOS:
        from_secret: weekly_numbers_github_repos
      YOUTUBE_API_KEY:
        from_secret: youtube_api_key
      YOUTUBE_CHANNEL_ID:
        from_secret: youtube_channel_id
      NTFY_URL:
        from_secret: ntfy_url
      NTFY_TOPIC:
        from_secret: ntfy_topic
    when:
      event: cron
      cron: weekly-numbers
