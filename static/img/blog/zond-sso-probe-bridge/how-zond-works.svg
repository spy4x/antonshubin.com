<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520"
  viewBox="0 0 600 520" role="img"
  aria-label="You reach metube through the SSO proxy and log in. Gatus, in the cloud, asks zond for /health/metube on a URL outside the SSO. zond runs on the same Docker network as metube, sends it a plain HTTP GET without logging in, and answers 200 ok or 503 unreachable.">
  <defs>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
      markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#bcb7af" />
    </marker>
    <marker id="a-mist" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
      markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8ec5ec" />
    </marker>
  </defs>
  <rect width="600" height="520" rx="12" fill="#25211d" />
  <g font-family="IBM Plex Sans, Arial, Helvetica, sans-serif">
    <rect x="10" y="160" width="580" height="350" rx="14" fill="none"
      stroke="#857f79" stroke-width="2" stroke-dasharray="8 6" />
    <text x="30" y="492" font-size="16"
      fill="#bcb7af">Your server · one Docker network</text>

    <rect x="20" y="20" width="260" height="76" rx="10" fill="#2f2a26"
      stroke="#857f79" stroke-width="2" />
    <text x="150" y="54" font-size="21" font-weight="600" fill="#efebe2"
      text-anchor="middle">You</text>
    <text x="150" y="80" font-size="16" fill="#bcb7af"
      text-anchor="middle">in a browser</text>

    <rect x="320" y="20" width="260" height="76" rx="10" fill="#2f2a26"
      stroke="#857f79" stroke-width="2" />
    <text x="450" y="54" font-size="21" font-weight="600" fill="#efebe2"
      text-anchor="middle">Gatus</text>
    <text x="450" y="80" font-size="16" fill="#bcb7af"
      text-anchor="middle">monitor, in the cloud</text>

    <rect x="20" y="210" width="260" height="80" rx="10" fill="#2f2a26"
      stroke="#857f79" stroke-width="2" />
    <text x="150" y="244" font-size="21" font-weight="600" fill="#efebe2"
      text-anchor="middle">SSO proxy</text>
    <text x="150" y="270" font-size="16" fill="#bcb7af"
      text-anchor="middle">Authelia, Authentik</text>

    <rect x="320" y="210" width="260" height="80" rx="10" fill="#2f2a26"
      stroke="#8ec5ec" stroke-width="2.5" />
    <text x="450" y="244" font-size="21" font-weight="600" fill="#efebe2"
      text-anchor="middle">zond</text>
    <text x="450" y="270" font-size="16" fill="#bcb7af"
      text-anchor="middle">beside the service</text>

    <rect x="170" y="380" width="260" height="80" rx="10" fill="#2f2a26"
      stroke="#857f79" stroke-width="2" />
    <text x="300" y="414" font-size="21" font-weight="600" fill="#efebe2"
      text-anchor="middle">metube</text>
    <text x="300" y="440" font-size="15" fill="#bcb7af" text-anchor="middle"
      font-family="IBM Plex Mono, Menlo, Consolas, monospace">hl-metube:8081</text>

    <line x1="150" y1="96" x2="150" y2="205" stroke="#bcb7af" stroke-width="2"
      marker-end="url(#a-grey)" />
    <text x="162" y="136" font-size="16" fill="#bcb7af">log in</text>
    <path d="M150 290C150 340 230 330 250 375" fill="none" stroke="#bcb7af"
      stroke-width="2" marker-end="url(#a-grey)" />

    <line x1="410" y1="96" x2="410" y2="205" stroke="#8ec5ec"
      stroke-width="2.5" marker-end="url(#a-mist)" />
    <text x="400" y="128" font-size="14" fill="#8ec5ec" text-anchor="end"
      font-family="IBM Plex Mono, Menlo, Consolas, monospace">GET /health/metube</text>
    <text x="400" y="148" font-size="14" fill="#8ec5ec"
      text-anchor="end">public URL, no SSO</text>
    <line x1="450" y1="205" x2="450" y2="101" stroke="#8ec5ec"
      stroke-width="2.5" marker-end="url(#a-mist)" />
    <text x="462" y="128" font-size="14" fill="#8ec5ec"
      font-family="IBM Plex Mono, Menlo, Consolas, monospace">200 ok</text>
    <text x="462" y="148" font-size="14" fill="#8ec5ec"
      font-family="IBM Plex Mono, Menlo, Consolas, monospace">503 unreachable</text>

    <path d="M450 290C450 340 370 330 350 375" fill="none" stroke="#8ec5ec"
      stroke-width="2.5" marker-end="url(#a-mist)" />
    <text x="462" y="332" font-size="16" fill="#8ec5ec">plain HTTP GET,</text>
    <text x="462" y="352" font-size="16" fill="#8ec5ec">no login</text>
  </g>
</svg>
