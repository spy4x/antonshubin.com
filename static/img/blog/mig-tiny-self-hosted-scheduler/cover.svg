<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"
  viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a" />
  <text x="70" y="160" font-family="system-ui" font-size="64" font-weight="bold"
    fill="#a78bfa">mig</text>
  <text x="70" y="220" font-family="system-ui" font-size="30"
    fill="#94a3b8">A 200-line meeting scheduler</text>
  <text x="70" y="260" font-family="system-ui" font-size="30"
    fill="#94a3b8">because Calendly alternatives are overkill</text>
  <text x="70" y="380" font-family="ui-monospace,monospace" font-size="22"
    fill="#64748b">Visitor → mig → owner</text>
  <text x="70" y="420" font-family="ui-monospace,monospace" font-size="22"
    fill="#64748b">storage: data/bookings.json</text>
  <text x="70" y="460" font-family="ui-monospace,monospace" font-size="22"
    fill="#64748b">auth:    HMAC-signed cancel links</text>
  <text x="70" y="580" font-family="system-ui" font-size="22"
    fill="#64748b">github.com/spy4x/mig</text>
</svg>
