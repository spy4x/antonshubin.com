# Runs on pull requests into main, pushes to main and the cron trigger.
# `branch` matches a pull request by its target branch, so a commit on a PR
# branch builds once, as a pull_request, not again as a push.
#
# A pull request whose title starts with `[WIP]` runs wip.yml instead (quick
# checks only). Woodpecker sets `CI_COMMIT_MESSAGE` to the pull request's title
# on `pull_request` and `pull_request_metadata`. Removing `[WIP]` from the title
# is a `pull_request_metadata` event with the reason `edited`, so it starts this
# workflow without a push; every step that runs on `pull_request` therefore
# runs on `pull_request_metadata` too, or a title edit would report this
# workflow green after a short run. A body edit is `edited` too and re-runs this
# workflow on a ready pull request: rare, and accepted. This workflow reports
# `ci/woodpecker/pr/woodpecker`, the status branch protection requires, so a
# commit pushed while the title starts with `[WIP]` cannot merge. Putting
# `[WIP]` back without a push runs nothing and keeps the earlier statuses.
# scripts/ci-workflows.test.ts checks these conditions.
#
# A push to main runs `build` and `unit` only. The `nightly` cron on main runs
# every step but weekly-numbers and pushes to NTFY when one fails
# (docs/testing.md, "Continuous integration").
when:
  - event: push
    branch: main
  - event: pull_request
    branch: main
    evaluate: 'not (CI_COMMIT_MESSAGE startsWith "[WIP]")'
  # `CI_PIPELINE_EVENT_REASON` joins the reasons with commas.
  - event: pull_request_metadata
    branch: main
    evaluate: 'CI_PIPELINE_EVENT_REASON contains "edited" && not (CI_COMMIT_MESSAGE startsWith "[WIP]")'
  - event: cron

steps:
  # One build that every later step shares through the workspace: the Deno
  # cache (DENO_DIR in .ci/, gitignored), node_modules, _fresh/ and a copy of
  # this image's deno binary, so the Playwright and ffmpeg images below run
  # the same Deno 2.9.0 with no download. The steps after it run side by side.
  build:
    image: denoland/deno:2.9.0@sha256:8d24854de78a79c56e74b49aa4c5996c60e1fe3730efba8fbdd2692c582e6e29
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir"
      - mkdir -p .ci/bin && cp "$(command -v deno)" .ci/bin/deno
      - deno install --frozen
      - deno task build
    when: &every_event
      - event: [push, pull_request, pull_request_metadata]
      - event: cron
        cron: nightly

  # What `deno task check` runs before the browser tests, minus the build
  # (done above). scripts/video-cut.test.ts needs ffmpeg and runs in its own
  # step below.
  unit:
    image: denoland/deno:2.9.0@sha256:8d24854de78a79c56e74b49aa4c5996c60e1fe3730efba8fbdd2692c582e6e29
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir"
      - deno fmt --check .
      - deno lint .
      - deno check
      - deno task test:unit --ignore=scripts/video-cut.test.ts
    depends_on: [build]
    when: *every_event

  # The browser-driven tests (every test/**/*.browser.test.ts) in four shards
  # balanced by their CI times (scripts/browser-shard.ts). The Playwright image
  # matches deno.json's "playwright" import (1.63.0): it holds the Chromium
  # build that version launches, its libraries and fonts, so no step downloads
  # a browser.
  # These, video-cut and lighthouse run on pull requests and the nightly cron,
  # never on a push to main: the merged commit's pull request already ran them,
  # and a run after the merge cannot stop it (#720).
  browser-1:
    image: &playwright mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir" PATH="$${CI_WORKSPACE}/.ci/bin:$${PATH}"
      - deno run -A scripts/browser-shard.ts 1/4
    depends_on: [build]
    when: &pr_or_nightly
      - event: [pull_request, pull_request_metadata]
      - event: cron
        cron: nightly

  browser-2:
    image: *playwright
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir" PATH="$${CI_WORKSPACE}/.ci/bin:$${PATH}"
      - deno run -A scripts/browser-shard.ts 2/4
    depends_on: [build]
    when: *pr_or_nightly

  browser-3:
    image: *playwright
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir" PATH="$${CI_WORKSPACE}/.ci/bin:$${PATH}"
      - deno run -A scripts/browser-shard.ts 3/4
    depends_on: [build]
    when: *pr_or_nightly

  browser-4:
    image: *playwright
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir" PATH="$${CI_WORKSPACE}/.ci/bin:$${PATH}"
      - deno run -A scripts/browser-shard.ts 4/4
    depends_on: [build]
    when: *pr_or_nightly

  # scripts/video-cut.test.ts renders a generated clip with ffmpeg and ffprobe
  # (libass burns the captions, so it needs a font). This image has all of
  # them, and glibc for the copied deno. It sets LD_LIBRARY_PATH, which Deno
  # passes to a child process only under a bare --allow-run: hence -A.
  video-cut:
    image: jrottenberg/ffmpeg:7.1-ubuntu2404@sha256:292a972c60356abd651d9a4f9c808c13e7473f65ad400b7eb99215f4e571931d
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir" PATH="$${CI_WORKSPACE}/.ci/bin:$${PATH}"
      - deno test -A scripts/video-cut.test.ts
    depends_on: [build]
    when: *pr_or_nightly

  # The Lighthouse budget ("Design gate" in the global agent rules): every
  # page in scripts/lighthouse/lighthouserc.json scores, in Lighthouse mobile,
  # at least 95 for performance and 100 for accessibility, best practices and
  # SEO. scripts/lighthouse/run.sh serves the build step's _fresh/ behind nginx
  # with gzip, as Cloudflare serves it. The Playwright image: Lighthouse CI
  # starts Lighthouse with `node`, and the image has Node, Chromium and its
  # libraries. It has no nginx, the one package this pipeline installs. One
  # step, after the browser shards: a busy CPU lowers the performance score.
  # Pages near the 95 line failed both beside the browser shards and when three
  # Lighthouse shards ran side by side (pipelines 1998 and 2004).
  lighthouse:
    image: *playwright
    commands:
      - export DENO_DIR="$${CI_WORKSPACE}/.ci/deno-dir" PATH="$${CI_WORKSPACE}/.ci/bin:$${PATH}"
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends nginx
      - deno task lighthouse
    depends_on: [browser-1, browser-2, browser-3, browser-4]
    when: *pr_or_nightly

  # A red nightly run blocks nothing, so it pushes to NTFY instead: the same
  # secrets as weekly-numbers. Runs only when an earlier step failed.
  notify-nightly:
    image: denoland/deno:2.9.0@sha256:8d24854de78a79c56e74b49aa4c5996c60e1fe3730efba8fbdd2692c582e6e29
    commands:
      - >-
          deno eval 'const e = (k) => Deno.env.get(k);
          const r = await fetch(e("NTFY_URL").replace(/\/$/, "") + "/" + e("NTFY_TOPIC"),
          { method: "POST", headers: { Title: "antonshubin.com: nightly CI failed" },
          body: e("CI_PIPELINE_URL") });
          if (!r.ok) throw new Error(r.status + " " + r.statusText)'
    environment:
      NTFY_URL:
        from_secret: ntfy_url
      NTFY_TOPIC:
        from_secret: ntfy_topic
    depends_on: [unit, video-cut, lighthouse]
    when:
      event: cron
      cron: nightly
      status: [failure]

  # Sunday numbers report: visitors/pages/referrers/CTA events (Umami), stars
  # (GitHub), subscribers/views (YouTube) — printed as markdown and pushed to
  # NTFY. Fires only on the "weekly-numbers" cron trigger, never on push or
  # pull_request, and no build or test step runs on this trigger. See
  # docs/weekly-numbers.md for the one-time cron setup and the env vars this
  # step needs.
  weekly-numbers:
    image: denoland/deno:2.9.0@sha256:8d24854de78a79c56e74b49aa4c5996c60e1fe3730efba8fbdd2692c582e6e29
    commands:
      - deno install --frozen
      - deno task weekly-numbers
    environment:
      UMAMI_API_URL:
        from_secret: umami_api_url
      UMAMI_API_TOKEN:
        from_secret: umami_api_token
      UMAMI_ID:
        from_secret: umami_id
      GITHUB_REPOS:
        from_secret: weekly_numbers_github_repos
      YOUTUBE_API_KEY:
        from_secret: youtube_api_key
      YOUTUBE_CHANNEL_ID:
        from_secret: youtube_channel_id
      NTFY_URL:
        from_secret: ntfy_url
      NTFY_TOPIC:
        from_secret: ntfy_topic
    when:
      event: cron
      cron: weekly-numbers
